[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ishtaran"
version = "1.0.0.dev0"
description = "Official Python SDK for the Ishtaran programmable financial platform API."
readme = "README.md"
requires-python = ">=3.10"
# Licença: decisão de projeto ainda não tomada (ver SDK_CAPABILITY_SPEC.md §16). Placeholder
# explícito, nunca assumido como open-source silenciosamente. Bloqueia publicação real no PyPI,
# não bloqueia build/uso local.
license = { text = "UNLICENSED - pending project decision, see SDK_CAPABILITY_SPEC.md section 16" }
authors = [{ name = "Ishtaran" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://ishtaran.com"
Repository = "https://github.com/ishtaran/ishtaran-python"

[tool.hatch.build.targets.wheel]
packages = ["src/ishtaran"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
